[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilvol"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stabilvol*"]
